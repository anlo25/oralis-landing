<style>
:root{--navy:#0F2C59;--accent:#00BFA5;--ink2:#2C3E63;--muted:#526173;--line:#E2E8F0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#E8F1F8 0%,#F8FAFC 100%);color:var(--navy);font-family:Manrope,system-ui,sans-serif}
.box{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:36px 28px;text-align:center;box-shadow:0 24px 50px -24px rgba(15,44,89,.35)}
.ok{width:68px;height:68px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:var(--navy)}
h1{margin:20px 0 12px;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 22px;font-size:17px;line-height:1.55;color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--navy);font-size:17px;font-weight:800;text-decoration:none}
.btn:hover{filter:brightness(.93)}
.sec{display:inline-flex;align-items:center;min-height:44px;margin-top:12px;font-size:15px;font-weight:700;color:var(--navy)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KMMVRVCM" height="0" width="0" style="display:none;visibility:hidden" title="gtm"></iframe></noscript>

  <h1 id="titulo">¡Listo! Tu cupo quedó reservado</h1>

</main>
<script>
(function () {
  var n = new URLSearchParams(location.search).get('n');
  if (n) {
    // textContent evita inyección de HTML desde la URL
    document.getElementById('titulo').textContent = '¡Listo, ' + n.slice(0, 30) + '! Tu cupo quedó reservado';
  }
  var url = (window.ORALIS_CONFIG || {}).CALENDLY_URL;
  if (url) { document.getElementById('calendly').href = url; }
})();
</script>
